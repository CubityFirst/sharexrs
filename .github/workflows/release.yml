# Builds ShareXrs for every platform when a version tag (e.g. v22.4.0) is
# pushed and publishes the packages (package.yml, docs/RELEASING.md) with a
# SHA256SUMS file as a GitHub release.
#
# The tag must match Cargo.toml's version, and the macOS build must be signed
# with the release certificate (secrets MACOS_SIGNING_P12 and
# MACOS_SIGNING_P12_PASSWORD), or nothing is published. The services' API keys
# come from the SHAREXRS_KEY_* secrets (empty when not set).
#
# The release notes are the commits since the previous version tag
# (scripts/release-notes.sh), grouped by their Conventional Commits types,
# then a table of the files' SHA256s (as ShareX's release body has).
#
# Tags with a hyphen (v22.5.0-rc.1) become pre-releases.
#
# Run it by hand on a branch (Actions > Release > Run workflow) to build every
# package without publishing anything: the packages are the run's artifacts.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml
    secrets: inherit

  release:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history and its tags, for the notes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release notes from the commits since the last version
        run: bash scripts/release-notes.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > notes.md

      - uses: actions/download-artifact@v4
        with:
          pattern: ShareXrs-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS
          {
            echo
            echo "| File | SHA256 |"
            echo "| --- | --- |"
            while read -r hash name; do
              echo "| $name | \`$hash\` |"
            done < SHA256SUMS
          } >> ../notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ShareXrs ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag \
            "${flags[@]}"
