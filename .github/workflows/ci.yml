# Builds and tests on all three platforms on every push and pull request:
# snapr's macOS build once broke silently for weeks because only release
# tags built it (docs/MACOS-LEARNINGS.md 3.12). Pushes to master, and pull
# requests that touch packaging, also build every release package
# (package.yml, unsigned: the Mac app ad hoc, no API keys), so packaging
# breaks show up here, not at release time.

name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev libpipewire-0.3-dev libspa-0.2-dev \
            libgbm-dev libdrm-dev libegl-dev libwayland-dev libxkbcommon-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libdbus-1-dev libssl-dev
      # The version in rust-toolchain.toml, so CI's clippy is the one
      # developers run (a newer stable added lints the code hadn't seen).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --workspace --locked --target ${{ matrix.target }}
      - name: Test
        run: cargo test --workspace --locked --target ${{ matrix.target }}
      - name: Clippy
        run: cargo clippy --workspace --locked --target ${{ matrix.target }} -- -D warnings

  # Whether to build the packages: on master pushes, and on pull requests
  # that change what goes into them. Release builds of four targets take a
  # while, so not on every push.
  packaging-changed:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          run=false
          if [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/master ]; then
            run=true
          elif [ "$EVENT" = pull_request ] && git diff --name-only "$BASE" HEAD |
            grep -qE '^(packaging/|scripts/(package-|macos-bundle|fetch-bundled|release-notes)|\.github/workflows/(ci|package|release)\.yml$|crates/sharexrs/(Cargo\.toml|build\.rs)$|\.cargo/|Cargo\.lock$|assets/)'; then
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  package:
    needs: packaging-changed
    if: needs.packaging-changed.outputs.run == 'true'
    uses: ./.github/workflows/package.yml
    with:
      retention-days: 3
