# Builds ShareXrs's release packages for every platform (docs/RELEASING.md):
#
#   Windows x64, ARM64   ShareXrs-<ver>-setup-<x64|arm64>.exe (Inno Setup),
#                        ShareXrs-<ver>-portable-<x64|arm64>.zip
#   macOS Apple silicon  ShareXrs-macos-aarch64.dmg, ShareXrs-macos-aarch64.app.zip
#   Linux x86_64         ShareXrs-<ver>-linux-x64.deb, ShareXrs-<ver>-linux-x64.tar.gz
#
# each with FFmpeg, ONNX Runtime and the OCR models beside the program
# (scripts/fetch-bundled.py, pinned and SHA256-checked in packaging/bundled.json).
#
# Called by release.yml (tags, and dry runs by hand) with the secrets, and by
# ci.yml (master pushes, and pull requests that touch packaging) without:
# then the Mac app is signed ad hoc and the API keys are empty. A tag fails
# without the macOS signing certificate.

name: Package

on:
  workflow_call:
    inputs:
      retention-days:
        description: How long the packages are kept as workflow artifacts
        type: number
        default: 7

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            arch: x64
          # Cross-compiled on x64, whose image has the MSVC ARM64 tools and
          # clang (.cargo/config.toml links the C runtime in).
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows-arm64
            arch: arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            arch: aarch64
          # 24.04, as CI: the PipeWire bindings need its headers. The .deb
          # then needs Ubuntu 24.04 / Debian 13 or newer.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      SHAREXRS_BUNDLED_CACHE: ${{ github.workspace }}/build/bundled-cache
    steps:
      - uses: actions/checkout@v4

      - name: Version from Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # A build that reports another version than its release would offer
      # itself as an update forever (docs/MACOS-LEARNINGS.md 2.2).
      - name: Check the tag matches Cargo.toml
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in Cargo.toml ($VERSION)"
            exit 1
          fi

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev libpipewire-0.3-dev libspa-0.2-dev \
            libgbm-dev libdrm-dev libegl-dev libwayland-dev libxkbcommon-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libdbus-1-dev libssl-dev libasound2-dev

      # The version in rust-toolchain.toml, as CI.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # The services' API keys are compiled in from SHAREXRS_KEY_* variables
      # (crates/sharex-uploaders/src/api_keys.rs), from same-named secrets:
      # ShareXrs's own registrations, never ShareX's. A missing secret is an
      # empty key, as in a ShareX built from source.
      - name: Build
        env:
          SHAREXRS_KEY_IMGUR_CLIENT_ID: ${{ secrets.SHAREXRS_KEY_IMGUR_CLIENT_ID }}
          SHAREXRS_KEY_IMGUR_CLIENT_SECRET: ${{ secrets.SHAREXRS_KEY_IMGUR_CLIENT_SECRET }}
          SHAREXRS_KEY_IMAGE_SHACK_KEY: ${{ secrets.SHAREXRS_KEY_IMAGE_SHACK_KEY }}
          SHAREXRS_KEY_FLICKR_KEY: ${{ secrets.SHAREXRS_KEY_FLICKR_KEY }}
          SHAREXRS_KEY_FLICKR_SECRET: ${{ secrets.SHAREXRS_KEY_FLICKR_SECRET }}
          SHAREXRS_KEY_PHOTOBUCKET_CONSUMER_KEY: ${{ secrets.SHAREXRS_KEY_PHOTOBUCKET_CONSUMER_KEY }}
          SHAREXRS_KEY_PHOTOBUCKET_CONSUMER_SECRET: ${{ secrets.SHAREXRS_KEY_PHOTOBUCKET_CONSUMER_SECRET }}
          SHAREXRS_KEY_PASTEBIN_KEY: ${{ secrets.SHAREXRS_KEY_PASTEBIN_KEY }}
          SHAREXRS_KEY_GITHUB_ID: ${{ secrets.SHAREXRS_KEY_GITHUB_ID }}
          SHAREXRS_KEY_GITHUB_SECRET: ${{ secrets.SHAREXRS_KEY_GITHUB_SECRET }}
          SHAREXRS_KEY_PASTE_EE_APPLICATION_KEY: ${{ secrets.SHAREXRS_KEY_PASTE_EE_APPLICATION_KEY }}
          SHAREXRS_KEY_DROPBOX_CONSUMER_KEY: ${{ secrets.SHAREXRS_KEY_DROPBOX_CONSUMER_KEY }}
          SHAREXRS_KEY_DROPBOX_CONSUMER_SECRET: ${{ secrets.SHAREXRS_KEY_DROPBOX_CONSUMER_SECRET }}
          SHAREXRS_KEY_BOX_CLIENT_ID: ${{ secrets.SHAREXRS_KEY_BOX_CLIENT_ID }}
          SHAREXRS_KEY_BOX_CLIENT_SECRET: ${{ secrets.SHAREXRS_KEY_BOX_CLIENT_SECRET }}
          SHAREXRS_KEY_SEND_SPACE_KEY: ${{ secrets.SHAREXRS_KEY_SEND_SPACE_KEY }}
          SHAREXRS_KEY_MEDIA_FIRE_APP_ID: ${{ secrets.SHAREXRS_KEY_MEDIA_FIRE_APP_ID }}
          SHAREXRS_KEY_MEDIA_FIRE_API_KEY: ${{ secrets.SHAREXRS_KEY_MEDIA_FIRE_API_KEY }}
          SHAREXRS_KEY_ONE_DRIVE_CLIENT_ID: ${{ secrets.SHAREXRS_KEY_ONE_DRIVE_CLIENT_ID }}
          SHAREXRS_KEY_ONE_DRIVE_CLIENT_SECRET: ${{ secrets.SHAREXRS_KEY_ONE_DRIVE_CLIENT_SECRET }}
          SHAREXRS_KEY_BITLY_CLIENT_ID: ${{ secrets.SHAREXRS_KEY_BITLY_CLIENT_ID }}
          SHAREXRS_KEY_BITLY_CLIENT_SECRET: ${{ secrets.SHAREXRS_KEY_BITLY_CLIENT_SECRET }}
          SHAREXRS_KEY_GOOGLE_CLIENT_ID: ${{ secrets.SHAREXRS_KEY_GOOGLE_CLIENT_ID }}
          SHAREXRS_KEY_GOOGLE_CLIENT_SECRET: ${{ secrets.SHAREXRS_KEY_GOOGLE_CLIENT_SECRET }}
        run: cargo build --release --locked -p sharexrs -p sharexrs-native-messaging --target ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The downloads only change with packaging/bundled.json; every use
      # checks them against its SHA256 again.
      - uses: actions/cache@v4
        with:
          path: build/bundled-cache
          key: bundled-${{ matrix.platform }}-${{ hashFiles('packaging/bundled.json') }}

      - name: Fetch FFmpeg, ONNX Runtime and the OCR models
        shell: bash
        run: python -I scripts/fetch-bundled.py --platform ${{ matrix.platform }} --out build/payload --rust-target ${{ matrix.target }}

      # Inno Setup 6, as ShareX.Setup, pinned and checked; installed in
      # portable mode into the runner's temp folder.
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne 'A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C') { throw "Inno Setup's SHA256 is $hash" }
          $dir = Join-Path $env:RUNNER_TEMP 'innosetup'
          Start-Process $installer -ArgumentList '/PORTABLE=1', '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', '/NOICONS', "/DIR=$dir" -Wait
          if (-not (Test-Path (Join-Path $dir 'ISCC.exe'))) { throw 'ISCC.exe was not installed' }
          "ISCC=$(Join-Path $dir 'ISCC.exe')" >> $env:GITHUB_ENV

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Exe target/${{ matrix.target }}/release/sharexrs.exe -Payload build/payload -Version $env:VERSION -Platform ${{ matrix.arch }} -Out dist -Iscc $env:ISCC

      # The self-signed certificate ShareXrs.app is signed with, so macOS
      # keeps its permissions across updates (docs/MACOS-LEARNINGS.md 1.3).
      # It must stay the same certificate: a new one resets everyone's
      # permissions. A release won't go out without it; other runs sign ad hoc.
      - name: Load the signing certificate
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::The MACOS_SIGNING_P12 secret is missing"
              exit 1
            fi
            echo "::warning::No MACOS_SIGNING_P12 secret: signing ad hoc"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<<"$P12" > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          # shellcheck disable=SC2046 # the existing keychains, one word each
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # The certificate by its SHA-1, whatever its name: self-signed, so
          # not "valid" to find-identity -v, which codesign doesn't need.
          identity=$(security find-identity -p codesigning "$keychain" | awk '$2 ~ /^[0-9A-F]{40}$/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::No code signing identity in MACOS_SIGNING_P12"
            exit 1
          fi
          echo "SHAREXRS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SHAREXRS_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Package ShareXrs.app
        if: runner.os == 'macOS'
        run: bash scripts/macos-bundle.sh "target/${{ matrix.target }}/release/sharexrs" "$VERSION" ${{ matrix.arch }} dist build/payload

      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-deb

      - name: Package for Linux
        if: runner.os == 'Linux'
        run: bash scripts/package-linux.sh ${{ matrix.target }} "$VERSION" build/payload dist

      - uses: actions/upload-artifact@v4
        with:
          name: ShareXrs-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
