[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/sharexrs"]

[workspace.package]
version = "22.4.0"
edition = "2024"
# A port of ShareX (GPL-3.0-or-later, see LICENSE), so the same licence.
license = "GPL-3.0-or-later"
repository = "https://github.com/CubityFirst/sharexrs"

[workspace.dependencies]
sharex-ui = { path = "crates/sharex-ui" }
sharex-strings = { path = "crates/sharex-strings" }
sharex-helpers = { path = "crates/sharex-helpers" }
sharex-capture = { path = "crates/sharex-capture" }
sharex-settings = { path = "crates/sharex-settings" }
sharex-skia = { path = "crates/sharex-skia" }
sharex-image-editor = { path = "crates/sharex-image-editor" }
sharex-image-effects = { path = "crates/sharex-image-effects" }
sharex-uploaders = { path = "crates/sharex-uploaders" }
sharex-screen-recording = { path = "crates/sharex-screen-recording" }
sharex-history = { path = "crates/sharex-history" }
sharex-ocr = { path = "crates/sharex-ocr" }
sharex-update = { path = "crates/sharex-update" }

egui = "0.36"
egui-wgpu = { version = "0.36", features = ["winit"] }
egui-winit = "0.36"
winit = "0.30"
pollster = "1.0.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
resvg = { version = "0.45", default-features = false }
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: settings keep ShareX's property order, and properties
# a newer ShareX added stay where they were.
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"

[profile.dev]
# Line numbers for panics without full debug info: full debug info made
# ~300 MB .pdb files per build in snapr and outgrew the linker's PDB limit.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies optimised even in debug builds: SVG rasterising and wgpu are
# painfully slow unoptimised.
opt-level = 2

[profile.release]
lto = "thin"
strip = true
