[package]
name = "sharex-update"
description = "ShareX's update check (ShareXUpdateManager, GitHubUpdateManager, GitHubUpdateChecker, UpdateChecker, FileDownloader and the update windows' logic) against ShareXrs's own GitHub releases, with the macOS and Linux install flows ShareX doesn't have."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sharex-uploaders.workspace = true
sharex-strings.workspace = true
sharex-settings.workspace = true
sharex-helpers.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
hex = "0.4"
# The Linux tarball is unpacked in place (an addition: ShareX only ships for Windows).
tar = { version = "0.4", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_WinTrust",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
