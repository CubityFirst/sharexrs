[package]
name = "sharexrs"
description = "ShareX, ported to Rust."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sharex-ui.workspace = true
sharex-strings.workspace = true
sharex-settings.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
winit.workspace = true
pollster.workspace = true
image.workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# Global hotkeys outside Windows, as snapr has them (docs/MACOS-LEARNINGS.md 3.2).
[target."cfg(not(windows))".dependencies]
livesplit-hotkey = "0.8.1"

[build-dependencies]
embed-resource = "3"
