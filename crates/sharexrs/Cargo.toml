[package]
name = "sharexrs"
description = "ShareX, ported to Rust."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sharex-ui.workspace = true
sharex-strings.workspace = true
sharex-capture.workspace = true
sharex-helpers.workspace = true
sharex-settings.workspace = true
sharex-image-effects.workspace = true
sharex-tools.workspace = true
sharex-skia.workspace = true
sharex-history.workspace = true
sharex-ocr.workspace = true
sharex-uploaders.workspace = true
sharex-update.workspace = true
sharex-screen-recording.workspace = true
# ShareX's native recorder (Windows: Media Foundation, D3D11, the adaptive GIF writer).
sharex-native-recorder.workspace = true
# .NET regex substitutions for the after upload URL replace, as sharex-uploaders uses it.
fancy-regex = "0.11"
sharex-image-editor.workspace = true
sharexrs-native-messaging.workspace = true
# `WebHelpers.DataURLToImage` (the browser extension's images).
base64 = "0.22"
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
winit.workspace = true
pollster.workspace = true
image.workspace = true
dirs.workspace = true
# The progress tray icon's percentage, drawn in Arial (`Helpers.GetProgressIconBytes`).
ab_glyph = "0.2.32"
serde.workspace = true
serde_json.workspace = true
chrono = "0.4.45"
# The file and folder pickers (`FileDialogHelpers`), as snapr has them.
rfd = "0.17.2"
# The QR code window: ZXing's encoding (`qrcode` segments) and scanning.
qrcode = { version = "0.14.1", default-features = false }
rqrr = { version = "0.11.0", default-features = false }
# FFmpeg's download (`FFmpegGitHubDownloader.ExtractFFmpeg`).
zip = { version = "2", default-features = false, features = ["deflate"] }
# Watch folders (`FileSystemWatcher`).
notify = "8"
# The video player's and trimmer's sound (Media Foundation's audio
# renderer in ShareX): FFmpeg decodes, cpal plays (WASAPI, Core Audio, ALSA).
cpal = "0.18.2"
# Reading FFmpeg's stream summary for playback.
regex = "1"

[target."cfg(windows)".dependencies]
# The Startup folder shortcut (`ShortcutHelpers`): IShellLinkW.
# Dragging files out (OLE's DoDragDrop with a shell data object).
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
# `#[implement]` (the drag source).
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Storage_Xps", "Win32_Graphics_Printing", "Win32_UI_Controls_Dialogs", "Win32_System_Console", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_Security"] }

# Global hotkeys outside Windows, as snapr has them (docs/MACOS-LEARNINGS.md 3.2).
[target."cfg(not(windows))".dependencies]
livesplit-hotkey = "0.8.1"
# stderr into the debug log (`dup2`).
libc = "0.2"

# The menu bar item and the Dock icon (docs/MACOS-LEARNINGS.md 3.5, 3.13).
[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

# The tray icon: a StatusNotifierItem over D-Bus, as snapr.
[target."cfg(target_os = \"linux\")".dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }

[dev-dependencies]
# Animated GIFs for the playback tests.
gif = "0.14.2"

[build-dependencies]
embed-resource = "3"

# The .deb (scripts/package-linux.sh, docs/RELEASING.md): the program and the
# pieces it finds beside itself in /usr/lib/sharexrs, staged into
# build/linux-package by the script; /usr/bin/sharexrs starts it from there.
[package.metadata.deb]
name = "sharexrs"
maintainer = "ShareXrs developers"
copyright = "2007-2026 ShareX Team; ShareXrs developers"
license-file = ["../../LICENSE", "0"]
section = "graphics"
priority = "optional"
depends = "$auto"
extended-description = """\
ShareXrs is ShareX, the screen capture, recording and file sharing tool, \
ported to Rust: capture a region, window or the whole screen, annotate, \
record video or GIFs with FFmpeg, recognise text, and upload to many \
services."""
assets = [
    ["target/release/sharexrs", "usr/lib/sharexrs/", "755"],
    ["../../build/linux-package/ffmpeg", "usr/lib/sharexrs/", "755"],
    ["../../build/linux-package/libonnxruntime.so", "usr/lib/sharexrs/", "644"],
    ["../../build/linux-package/Models/PP-OCRv6_small_det/inference.onnx", "usr/lib/sharexrs/Models/PP-OCRv6_small_det/", "644"],
    ["../../build/linux-package/Models/PP-OCRv6_small_det/inference.yml", "usr/lib/sharexrs/Models/PP-OCRv6_small_det/", "644"],
    ["../../build/linux-package/Models/PP-OCRv6_small_rec/inference.onnx", "usr/lib/sharexrs/Models/PP-OCRv6_small_rec/", "644"],
    ["../../build/linux-package/Models/PP-OCRv6_small_rec/inference.yml", "usr/lib/sharexrs/Models/PP-OCRv6_small_rec/", "644"],
    ["../../build/linux-package/Licenses/*", "usr/share/doc/sharexrs/Licenses/", "644"],
    ["../../packaging/linux/sharexrs", "usr/bin/", "755"],
    ["../../packaging/linux/sharexrs.desktop", "usr/share/applications/", "644"],
    ["../../assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/sharexrs.svg", "644"],
    ["../../assets/ShareXrs.iconset/icon_16x16.png", "usr/share/icons/hicolor/16x16/apps/sharexrs.png", "644"],
    ["../../assets/ShareXrs.iconset/icon_32x32.png", "usr/share/icons/hicolor/32x32/apps/sharexrs.png", "644"],
    ["../../assets/ShareXrs.iconset/icon_128x128.png", "usr/share/icons/hicolor/128x128/apps/sharexrs.png", "644"],
    ["../../assets/ShareXrs.iconset/icon_256x256.png", "usr/share/icons/hicolor/256x256/apps/sharexrs.png", "644"],
    ["../../assets/ShareXrs.iconset/icon_512x512.png", "usr/share/icons/hicolor/512x512/apps/sharexrs.png", "644"],
]
