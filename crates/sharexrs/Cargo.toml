[package]
name = "sharexrs"
description = "ShareX, ported to Rust."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sharex-ui.workspace = true
sharex-strings.workspace = true
sharex-capture.workspace = true
sharex-helpers.workspace = true
sharex-settings.workspace = true
sharex-image-effects.workspace = true
sharex-history.workspace = true
sharex-uploaders.workspace = true
# .NET regex substitutions for the after upload URL replace, as sharex-uploaders uses it.
fancy-regex = "0.11"
sharex-image-editor.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
winit.workspace = true
pollster.workspace = true
image.workspace = true
dirs.workspace = true
# The progress tray icon's percentage, drawn in Arial (`Helpers.GetProgressIconBytes`).
ab_glyph = "0.2.32"
serde_json.workspace = true
chrono = "0.4.45"
# The file and folder pickers (`FileDialogHelpers`), as snapr has them.
rfd = "0.17.2"
# The QR code window: ZXing's encoding (`qrcode` segments) and scanning.
qrcode = { version = "0.14.1", default-features = false }
rqrr = { version = "0.11.0", default-features = false }

[target."cfg(windows)".dependencies]
# The Startup folder shortcut (`ShortcutHelpers`): IShellLinkW.
windows = { version = "0.62.2", features = ["Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

# Global hotkeys outside Windows, as snapr has them (docs/MACOS-LEARNINGS.md 3.2).
[target."cfg(not(windows))".dependencies]
livesplit-hotkey = "0.8.1"

# The menu bar item and the Dock icon (docs/MACOS-LEARNINGS.md 3.5, 3.13).
[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

# The tray icon: a StatusNotifierItem over D-Bus, as snapr.
[target."cfg(target_os = \"linux\")".dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }

[dev-dependencies]
# The mock server's log has bodies in base 64.
base64 = "0.22"

[build-dependencies]
embed-resource = "3"
