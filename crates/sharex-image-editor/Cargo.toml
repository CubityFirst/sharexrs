[package]
name = "sharex-image-editor"
description = "ShareX.ImageEditor, ported: the annotation model and how each annotation renders."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sharex-settings.workspace = true
sharex-skia.workspace = true
serde.workspace = true
serde_json.workspace = true
# Image files the effects load (SKBitmap.Decode).
image.workspace = true
ttf-parser = "0.25.1"
harfrust = "0.12"
# Installed families by name on every platform (Windows, macOS, Linux).
fontdb = "0.23"
# The wallpaper conversion cache's file names (LinuxDesktopWallpaperService).
sha2 = "0.10"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation"] }

[dev-dependencies]
image.workspace = true
