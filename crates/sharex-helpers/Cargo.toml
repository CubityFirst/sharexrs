[package]
name = "sharex-helpers"
description = "The parts of ShareX.HelpersLib that ShareXrs's tools share: the file name pattern parser (NameParser), file helpers and MIME types."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = "0.4.45"
getrandom = "0.3"
sharex-strings.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_Globalization", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
serde_json.workspace = true
