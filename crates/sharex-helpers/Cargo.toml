[package]
name = "sharex-helpers"
description = "The parts of ShareX.HelpersLib that ShareXrs's tools share: the file name pattern parser (NameParser), file helpers and MIME types."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = "0.4.45"
getrandom = "0.3"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_Globalization"] }
