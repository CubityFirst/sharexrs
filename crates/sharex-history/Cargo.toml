[package]
name = "sharex-history"
description = "ShareX.HistoryLib as data: History.db (ShareX's SQLite schema and values), the legacy JSON/XML history files, the History and Image history windows' queries, and the stats."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sharex-helpers.workspace = true
sharex-strings.workspace = true
roxmltree = "0.20"
serde.workspace = true
serde_json.workspace = true
chrono = "0.4.45"
regex = "1"

# SQLite: compiled in (as ShareX ships e_sqlite3) where a C compiler for the
# target is at hand; on macOS the system's libsqlite3, so the macOS lint
# runs from Windows without a cross C compiler.
[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = "0.43"

