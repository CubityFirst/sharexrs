[package]
name = "sharex-uploaders"
description = "ShareX.UploadersLib: the upload destinations, custom uploaders (.sxcu), URL shorteners and sharing services, and UploadersConfig."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sharex-settings.workspace = true
sharex-helpers.workspace = true
sharex-strings.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Blocking HTTP on rustls, with the OS's certificate store as .NET uses it.
# The OS's TLS (SChannel, Secure Transport, OpenSSL) and its certificate
# store, as ShareX's HttpClient uses: same trust as the system (corporate
# CAs and proxies), and no C toolchain needed to cross-check other targets.
ureq = { version = "3.4", default-features = false, features = ["native-tls", "socks-proxy"] }
encoding_rs = "0.8"
# .NET regexes have lookaround and named groups; `regex` has neither.
fancy-regex = "0.11"
# XPath 1.0 for {xml:...}, as XPathNavigator.SelectSingleNode.
sxd-document = "0.3"
sxd-xpath = "0.4"
# XDocument, for S3's XML responses.
roxmltree = "0.20"
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# FTPS (and the mock servers' TLS): the OS's TLS, as ureq uses here.
native-tls = "0.2"
# RustCrypto (pure Rust, MIT/Apache-2.0): B2's SHA1, SendSpace/MediaFire's MD5,
# PrivateBin's AES-CBC + PBKDF2, MEGA's AES.
sha1 = "0.10"
md-5 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
ctr = "0.9"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
num-bigint = "0.4"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
