[package]
name = "sharex-tools"
description = "The engines behind ShareX's Tools menu (ShareX.Tools): the image tools (combiner, splitter, thumbnailer, resizer, converter, watermark, icon converter, comparer), hash checker, QR codes, folder indexer, metadata reader and stripper, the FFmpeg command lines of the video tools and the monitor test patterns, without their windows."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sharex-helpers.workspace = true
sharex-strings.workspace = true
sharex-skia.workspace = true
sharex-image-effects.workspace = true
sharex-screen-recording.workspace = true
sharex-settings.workspace = true
# Analyze image: the HTTP layer (ShareXrs's user agent, proxy), [JsonEncrypt] keys, Newtonsoft JSON.
sharex-uploaders.workspace = true
# The background remover: ONNX Runtime as the OCR loads it.
sharex-ocr.workspace = true
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
image.workspace = true
png = "0.18"
# The GIF trimmer's frame decoding (LZW, interlacing); compositing is Skia's, here.
gif = "0.14.2"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
rxing = { version = "0.9", default-features = false, features = ["encoding_rs", "encoders", "decoders", "full_barcode_format_support", "multi_barcode_readers"] }
chrono = "0.4.45"
regex = "1"
roxmltree = "0.20"
tiny-skia = "0.11.4"
# Lossy and lossless WebP: libwebp built from source with `cc`. 0.14.4 bundles
# exactly the libwebp SkiaSharp 3.119.4 compiles into libSkiaSharp
# (tools/tools-harness/libwebp-sources.md5: all 112 files match), so
# ShareX's WebP files come out byte for byte. Pinned for that reason.
libwebp-sys = { version = "=0.14.4", default-features = false }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dev-dependencies]
serde_json.workspace = true
